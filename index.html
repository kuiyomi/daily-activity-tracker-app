<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Agenda</title>

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="./manifest.webmanifest" />

  <!-- iOS PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Agenda" />
  <!--
    apple-mobile-web-app-status-bar-style: "default"
    In iOS 15+, "default" cooperates with the theme-color meta tags below to render dark text
    in light mode and light text in dark mode. "black-translucent" forces white text on all
    modes, making the status bar illegible against light backgrounds.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />

  <!-- Theme color for light and dark mode -->
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" data-scheme="light" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" data-scheme="dark" />

  <!-- Early theme application to avoid flash of wrong theme -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme-preference') || 'auto';
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
          var metaLight = document.querySelector('meta[data-scheme="light"]');
          var metaDark = document.querySelector('meta[data-scheme="dark"]');
          var hex = theme === 'dark' ? '#000000' : '#F2F2F7';
          if (metaLight) { metaLight.setAttribute('content', hex); metaLight.removeAttribute('media'); }
          if (metaDark) { metaDark.setAttribute('content', hex); metaDark.removeAttribute('media'); }
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="./src/styles.css" />
  <script src="./src/version.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
